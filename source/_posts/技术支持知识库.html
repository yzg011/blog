    <title>技术支持知识库</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-light: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
        }

        /* 顶部导航 */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 24px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-lg);
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 搜索框 */
        .search-wrapper {
            position: relative;
        }

        .search-box {
            display: flex;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .search-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 1rem;
            border: none;
            outline: none;
            color: var(--text);
        }

        .search-btn {
            padding: 14px 24px;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: var(--primary-dark);
        }

        /* 搜索建议 */
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 12px;
            margin-top: 8px;
            box-shadow: var(--shadow-lg);
            max-height: 320px;
            overflow-y: auto;
            display: none;
            z-index: 200;
        }

        .suggestions.show {
            display: block;
        }

        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: #eff6ff;
        }

        .suggestion-item .title {
            font-weight: 500;
            color: var(--text);
        }

        .suggestion-item .category {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* 主容器 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* 智能问答卡片 */
        .ai-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .ai-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .ai-title h3 {
            font-size: 1.1rem;
            color: var(--text);
        }

        .ai-title p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        /* 对话区域 */
        .chat-area {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .chat-placeholder {
            text-align: center;
            color: var(--text-light);
            padding: 40px 20px;
            line-height: 2;
        }

        .chat-placeholder .emoji {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .chat-message {
            margin-bottom: 16px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.user {
            text-align: right;
        }

        .chat-message .bubble {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 85%;
            text-align: left;
            line-height: 1.6;
        }

        .chat-message.user .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-message.bot .bubble {
            background: white;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }

        .chat-message.bot .bubble strong {
            color: var(--primary);
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .chat-message.bot .bubble p {
            margin: 8px 0;
        }

        .chat-message.bot .bubble .label {
            font-weight: 600;
            color: var(--text);
            margin-top: 10px;
        }

        .chat-message.bot .bubble .warning {
            background: #fef2f2;
            color: var(--danger);
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .chat-message.bot .bubble ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .chat-message.bot .bubble ol li {
            margin: 4px 0;
        }

        .suggestion-links {
            margin-top: 10px;
        }

        .suggestion-links a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .suggestion-links a:hover {
            text-decoration: underline;
        }

        /* 输入区 */
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .input-area input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--primary);
        }

        .input-area button {
            padding: 14px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-area button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* 热门问题 */
        .quick-section {
            margin-top: 16px;
        }

        .quick-section h4 {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 12px;
        }

        .quick-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-btn {
            padding: 8px 14px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .quick-btn .count {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        /* 搜索结果 */
        .results-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: none;
        }

        .results-card.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        .results-header h3 {
            font-size: 1.1rem;
            color: var(--text);
        }

        .results-header .close-btn {
            padding: 6px 12px;
            background: #f1f5f9;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .results-header .close-btn:hover {
            background: #e2e8f0;
        }

        /* 知识卡片 */
        .knowledge-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 4px solid var(--primary);
            transition: all 0.2s;
        }

        .knowledge-card:hover {
            box-shadow: var(--shadow);
            transform: translateX(4px);
        }

        .knowledge-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .knowledge-card .title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }

        .knowledge-card .meta {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .knowledge-card .tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .knowledge-card .tag.cat {
            background: #dbeafe;
            color: var(--primary);
        }

        .knowledge-card .tag.match {
            background: #d1fae5;
            color: var(--success);
        }

        .knowledge-card .tag.views {
            color: var(--text-light);
            font-size: 0.8rem;
        }

        .knowledge-card .problem {
            color: var(--text-light);
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .knowledge-card .solution-box {
            background: white;
            border-radius: 10px;
            padding: 16px;
            margin-top: 12px;
        }

        .knowledge-card .solution-box h4 {
            color: var(--success);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .knowledge-card .causes-box {
            background: #fffbeb;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 12px;
        }

        .knowledge-card .causes-box h4 {
            color: var(--warning);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .knowledge-card .steps-box {
            background: white;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 12px;
        }

        .knowledge-card .steps-box h4 {
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .knowledge-card .steps-box ol {
            padding-left: 20px;
            margin: 0;
        }

        .knowledge-card .steps-box li {
            margin: 4px 0;
            color: var(--text);
        }

        .knowledge-card .warning-box {
            background: #fef2f2;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 12px;
            color: var(--danger);
            font-size: 0.9rem;
        }

        /* 分类导航 */
        .category-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .category-btn {
            padding: 8px 16px;
            background: #f1f5f9;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--primary);
            color: white;
        }

        /* 空结果 */
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .no-results .icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        /* 调试 */
        #debug-toggle {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: #333;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1001;
        }

        #debug-panel {
            position: fixed;
            bottom: 60px;
            left: 15px;
            background: #1a1a1a;
            color: #0f0;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            max-width: 350px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            z-index: 1001;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.3rem;
            }
            .search-btn {
                padding: 14px 16px;
            }
            .input-area {
                flex-direction: column;
            }
            .input-area button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">

                    <h3>智能问答助手</h3>

            </div>

    <script>
        // ============ 知识库数据（来自Excel文档 + Word文档） ============
        // Excel数据：84条技术支持记录

": ["鸿蒙", "移动侦测", "报警"]}, {"id": 52, "category": "低功耗设备", "title": "低功耗喂鸟器录制5S视频", "problem": "低功耗喂鸟器BF01需要支持检测到小鸟后录制5S视频？", "solution": "订阅功能，开通即可。", "views": 253, "keywords": ["喂鸟器", "录制", "视频"]}, {"id": 53, "category": "设备问题", "title": "Onvif的IP地址用途是什么？", "problem": "关于Onvif，设备信息中分配的IP 地址用途是什么？", "solution": "是设备的公网ip地址，主要用于tuya的云服务，包括穿透等", "views": 256, "keywords": ["Onvif", "IP地址", "用途"]}, {"id": 54, "category": "低功耗设备", "title": "低功耗喂鸟器近距离看小鸟会模糊怎么办？", "problem": "低功耗喂鸟器近距离看小鸟会模糊怎么办？", "solution": "设计定义镜头景深是10-15cm，小鸟在镜头前的距离小于10cm时，会虚焦。", "views": 259, "keywords": ["喂鸟器", "模糊", "近距离"]}, {"id": 55, "category": "设备问题", "title": "BF-02的粮仓容量是多少？", "problem": "BF-02的粮仓容量是多少？", "solution": "BF-02的容量估算是1.2升。", "views": 262, "keywords": ["BF-02", "粮仓", "容量"]}, {"id": 56, "category": "图像问题", "title": "窗户机是否有温湿度探测功能？", "problem": "窗户机是否有温湿度探测功能？", "solution": "目前已知W9有温湿度探测功能。W9之前的都没有。W9之后的需根据实物而定。", "views": 265, "keywords": ["窗户机", "温湿度", "探测"]}, {"id": 57, "category": "低功耗设备", "title": "低功耗喂食器为什么离线了不能喂食？", "problem": "低功耗喂食器为什么离线了不能喂食？", "solution": "离线后，是通过1号电池供电实现喂食功能。未安装一号电池则可能无法离线喂食。", "views": 268, "keywords": ["喂食器", "离线", "电池"]}, {"id": 58, "category": "婴儿看护", "title": "婴儿看护B1的灯光是什么样的？", "problem": "婴儿看护B1的灯光是什么样的，支持全彩吗？", "solution": "B1灯板是RGB三色可调的，默认夜视是红外，手动开启彩灯后图像会切换成彩色。", "views": 271, "keywords": ["B1", "灯光", "全彩", "RGB"]}, {"id": 59, "category": "智能喂水机", "title": "喂水机支不支持缺水提醒？", "problem": "喂水机支不支持缺水提醒？", "solution": "支持。", "views": 274, "keywords": ["喂水机", "缺水", "提醒"]}, {"id": 60, "category": "设备问题", "title": "摄像机是否支持苹果Homekit？", "problem": "摄像机是否支持苹果Homekit？", "solution": "仅支持谷歌音箱和亚马逊音箱，不支持苹果音箱", "views": 277, "keywords": ["Homekit", "苹果", "HomePod"]}, {"id": 61, "category": "婴儿看护", "title": "婴儿看护B1能不能加安抚音功能？", "problem": "婴儿看护B1能不能加安抚音功能？", "solution": "B1中性版本目前没有安抚音功能。", "views": 280, "keywords": ["B1", "安抚音", "功能"]}, {"id": 62, "category": "云台问题", "title": "P3P/G12是否支持变倍？", "problem": "P3P/G12是否支持变倍，变倍倍数是多少，是否会影响画质？", "solution": "支持3X倍数，电子变倍会牺牲一些画质，但是不会非常明显", "views": 283, "keywords": ["P3P", "G12", "变倍", "画质"]}, {"id": 63, "category": "低功耗设备", "title": "摄像机电池耗完电关机后，太阳能板充不进电", "problem": "摄像机电池耗完电关机后，太阳能板充不进电", "solution": "由于耗电太多，充电时间会长一些。且放电电压在3.2V左右。只要开关没有关闭就会继续消耗深度睡眠的电量，充电的时间会更长。可设置有低电量提醒来规避过度放电。", "views": 286, "keywords": ["太阳能", "充电", "电池"]}, {"id": 64, "category": "图像问题", "title": "窗户机开特写追踪功能，无法触发", "problem": "窗户机开特写追踪功能，无法触发，为什么会这样？", "solution": "需要开启人形检测后特写追踪才能生效。", "views": 289, "keywords": ["特写追踪", "人形检测", "窗户机"]}, {"id": 65, "category": "低功耗设备", "title": "低功耗门铃的强供电电压是多少？", "problem": "低功耗门铃的强供电电压是多少？", "solution": "AC8~24V。", "views": 292, "keywords": ["门铃", "强供电", "电压"]}, {"id": 66, "category": "设备问题", "title": "新涂鸦面板的灯光定时设置", "problem": "老涂鸦面板和新涂鸦面板，新面板的灯光开启和关闭，不能支持定时设置吗？", "solution": "新面板暂时还不支持，新面板很多功能都还在完善中", "views": 295, "keywords": ["涂鸦面板", "定时", "灯光"]}, {"id": 67, "category": "低功耗设备", "title": "WL1的PIR侦测距离要求", "problem": "WL1，PIR的侦测距离，安装方式有什么要求？", "solution": "PIR灵敏度触发距离1.低：1-3(M) 2.中: 3-5(M) 3.高: 6-9(M)。测试的时候不要打开APP，模拟正常的使用场景。", "views": 298, "keywords": ["WL1", "PIR", "侦测距离"]}, {"id": 68, "category": "低功耗设备", "title": "低功耗B11/P3P/N1的电池容量", "problem": "低功耗B11/P3P/N1的电池容量规格和类型是什么？", "solution": "B11/P3P 是5200mAh的锂离子电池，通常是2节电池，N1是1720mAh的锂聚合物电池。", "views": 301, "keywords": ["B11", "P3P", "N1", "电池容量"]}, {"id": 69, "category": "设备问题", "title": "哪些摄像机支持网口？", "problem": "室内摇头机：F5, F7 室外摇头机：G1,G9, G11, G12,G15 枪机：V6Z 哪些支持网口", "solution": "F4/5/7，G11B, G11, G15", "views": 304, "keywords": ["网口", "有线", "网络"]}, {"id": 70, "category": "存储问题", "title": "SD卡录制时长估算", "problem": "请提供在特定容量下（例如32GB/64GB/128GB）的大致录制时长估算。", "solution": "一台4MP像机，在办公室场景下录制连续录像，32GB约录制9天；64GB约录制订18天；128G约录制36天；256G约录制72天。实际录像长度根据摄像机的像素/监控场景/运动时长而定。如果是2MP的就延长一倍存储时长。", "views": 307, "keywords": ["SD卡", "录制时长", "存储"]}, {"id": 71, "category": "低功耗设备", "title": "低功耗摄像机太阳能充电无法自启动", "problem": "低功耗摄像机电量耗尽后用太阳能充电，摄像机都已经45%的电量了，依旧无法自启动", "solution": "判断是充电的瞬时电流太小无法启动摄像机，要求瞬时电流至少有0.4A才能启动；然而这个瞬时电流是受太阳光照的强度而变化的。建议在长期的阴雨天时最好设置低电量提醒，及时通过适配器充电。", "views": 310, "keywords": ["太阳能", "充电", "自启动"]}, {"id": 72, "category": "图像问题", "title": "摄像机的像素/分辨率有哪些规格？", "problem": "摄像机的像素/分辨率有哪些规格？", "solution": "常见规格有 1080P (2MP)、2K (3MP/4MP)、5MP、4K (8MP)。像素越高，图像细节越清晰。1080P：1920*1080；3MP：2304*1296；4MP:2596*1440；5MP:；4K:", "views": 313, "keywords": ["像素", "分辨率", "1080P", "2K", "4K"]}, {"id": 73, "category": "图像问题", "title": "摄像机的镜头焦距是多少？", "problem": "摄像机的镜头焦距是多少？对视角有什么影响？", "solution": "中性通用4mm（根据型号）；窗户摄像机：4mm/2.8mm，远焦；窗户喂鸟器：通用2.5mm，近焦5-15cm；爬宠摄像机：通用2.5mm，近焦10-30cm；鱼缸摄像机：通用2.5mm，近焦15-30cm。焦距越小，可视角度（广角）越大，但看得越近；焦距越大，可视角度越小，但看得越远。", "views": 316, "keywords": ["焦距", "视角", "镜头", "广角"]}, {"id": 74, "category": "图像问题", "title": "摄像机的夜视距离是多少？", "problem": "摄像机的夜视距离是多少？", "solution": "红外夜视距离通常在10-30米。具体距离取决于机身LED灯珠数量和功率。", "views": 319, "keywords": ["夜视", "距离", "红外"]}, {"id": 75, "category": "图像问题", "title": "摄像机是否支持防水？", "problem": "摄像机是否支持防水？防水等级是多少？", "solution": "室外摄像机通常支持IP65。需要安装在比风雨的地方。", "views": 322, "keywords": ["防水", "IP65", "等级"]}, {"id": 76, "category": "设备问题", "title": "摄像机的工作温度和湿度范围是多少？", "problem": "摄像机的工作温度和湿度范围是多少？", "solution": "一般为 -20°C ~ 50°C。湿度通常要求小于95%（无凝结）。", "views": 325, "keywords": ["温度", "湿度", "工作环境"]}, {"id": 77, "category": "存储问题", "title": "摄像机支持多大容量的Micro SD卡？", "problem": "摄像机支持多大容量的Micro SD卡？", "solution": "最大支持256GB，Class 10或更高速度等级的卡。", "views": 328, "keywords": ["SD卡", "容量", "256GB"]}, {"id": 78, "category": "云存储", "title": "摄像机支持云存储吗？", "problem": "摄像机支持云存储吗？", "solution": "支持。云存储为付费订阅服务，录像存储在云端。", "views": 331, "keywords": ["云存储", "云端", "付费"]}, {"id": 79, "category": "视频编码", "title": "摄像机支持H.265视频编码吗？", "problem": "摄像机支持H.265视频编码吗？有什么好处？", "solution": "大部分新款支持。H.265编码效率比H.264高约50%，可节省一半的存储空间和带宽。", "views": 334, "keywords": ["H.265", "H.264", "编码"]}, {"id": 80, "category": "设备问题", "title": "摄像机的电源规格是什么？", "problem": "摄像机的电源规格是什么？", "solution": "常为DC 5V/2A、DC 12V/1A或PoE (802.3af)供电。电池摄像机则使用内置锂电池。", "views": 337, "keywords": ["电源", "DC", "PoE", "电池"]}, {"id": 81, "category": "语音功能", "ti         // ============ 格式化 solution 文本为 HTML ============
        function formatSolution(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) {
                    // 空行：关闭列表，插入段间距
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<div style="height:6px"></div>';
                    return;
                }

                // 【标题块】如 【原因1：...】
                if (/^【.+】$/.test(trimmed)) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<div style="font-weight:600;color:var(--primary);margin:10px 0 4px;">' + trimmed + '</div>';
                    return;
                }

                // 数字步骤：1. / 1、
                if (/^\d+[\.、]/.test(trimmed)) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<div style="margin:5px 0 2px;"><span style="font-weight:600;color:var(--primary-dark);">' +
                        trimmed.replace(/^(\d+[\.、]\s*)/, '<span style="margin-right:4px;">$1</span>') +
                        '</span></div>';
                    return;
                }

                // 字母步骤：A. / B. 等
                if (/^[A-Z]\.\s/.test(trimmed)) {
                    if (!inList) { html += '<ul style="padding-left:20px;margin:3px 0;">'; inList = true; }
                    html += '<li style="margin:3px 0;">' + trimmed + '</li>';
                    return;
                }

                // - 列表项
                if (/^[-–•]/.test(trimmed)) {
                    const content = trimmed.replace(/^[-–•]\s*/, '');
                    // 带 → 箭头的行，高亮显示
                    const formatted = content.replace(/→/g, '<span style="color:var(--primary);font-weight:600;"> → </span>');
                    if (!inList) { html += '<ul style="padding-left:18px;margin:3px 0;">'; inList = true; }
                    html += '<li style="margin:3px 0;">' + formatted + '</li>';
                    return;
                }

                // 普通行
                if (inList) { html += '</ul>'; inList = false; }
                const formatted = trimmed
                    .replace(/→/g, '<span style="color:var(--primary);font-weight:600;"> → </span>')
                    .replace(/(⚠️[^<]+)/g, '<span style="color:var(--danger);">$1</span>');
                html += '<div style="margin:4px 0;">' + formatted + '</div>';
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderCard(item, highlight) {
            let html = '<div class="knowledge-card">';
            
            html += '<div class="card-header">';

            html += '<div class="problem">📌 ' + item.problem + '</div>';
            
            if (item.causes && item.causes.length > 0) {

            }
            
            html += '<div class="solution-box"><h4>✅ 解决方案</h4><div>' + formatSolution(item.solution) + '</div></div>';
            
            if (item.steps && item.steps.length > 0) {
                html += '<div class="steps-box"><h4>📋 操作步骤</h4><ol>';
                item.steps.forEach(s => html += '<li>' + s + '</li>');
                html += '</ol></div>';
            }
            
            if (item.warning) {
                html += '<div class="warning-box">⚠️ ' + item.warning + '</div>';
            }
            
            html += '</div>';
            return html;

        // ============ 搜索功能 ============
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) return;
            
            log('搜索: ' + query);
            const results = fuzzySearch(query);
            showResults(results, query);
        }

        function fuzzySearch(query) {
            const results = [];
            
            knowledgeBase.forEach(item => {
                let score = 0;
                let matchType = '';
                
                // 精准匹配
                if (item.title.toLowerCase().includes(query) || item.problem.toLowerCase().includes(query)) {
                    score = 100; matchType = 'exact';
                }
                // 关键词匹配
                else if (item.keywords.some(kw => kw.toLowerCase().includes(query) || query.includes(kw.toLowerCase()))) {
                    score = 80; matchType = 'keyword';
                }
                // 方案匹配
                else if (item.solution.toLowerCase().includes(query)) {
                    score = 60; matchType = 'solution';
                }
                // 模糊匹配
                else {
                    const words = query.split(/\s+/).filter(w => w.length >= 2);
                    let matchCount = 0;
                    const text = (item.title + ' ' + item.problem).toLowerCase();
                    words.forEach(word => {
                        if (text.includes(word)) matchCount++;
                        else if (word.length >= 3 && text.includes(word.substring(0, 2))) matchCount += 0.5;
                    });
                    if (matchCount > 0) {
                        score = Math.floor((matchCount / words.length) * 40);
                        matchType = 'fuzzy';
                    }
                }
                
                if (score > 0) {
                    results.push({ ...item, score, matchType });
                }
            });
            
            // 排序
            results.sort((a, b) => {
                if (a.matchType !== b.matchType) {
                    const order = { exact: 0, keyword: 1, solution: 2, fuzzy: 3 };
                    return order[a.matchType] - order[b.matchType];
                }
                return b.views - a.views;
            });
            
            return results;
        }

        function showResults(results, query) {
            resultsTitle.textContent = '找到 ' + results.length + ' 条相关结果';
            
            if (results.length === 0) {
                resultsList.innerHTML = '<div class="no-results"><div class="icon">🔍</div>未找到相关结果<br><small>试试其他关键词</small></div>';
            } else {
                const labels = { exact: '精准', keyword: '关键词', solution: '方案', fuzzy: '模糊' };
                resultsList.innerHTML = results.map(item => {
                    const card = renderCard(item, query);
                    return card.replace('class="knowledge-card">', 
                        'class="knowledge-card" data-id="' + item.id + '">')
                        .replace('</div><div class="meta">', 
                        '</div><div class="meta"><span class="tag match">' + labels[item.matchType] + '</span>');
                }).join('');
            }
            
            resultsCard.classList.add('show');
            resultsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeResults() {
            resultsCard.classList.remove('show');

            suggestions.classList.add('show');
        }

        // ============ 智能问答 ============
        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            log('提问: ' + message);
            addMessage('user', message);
            chatInput.value = '';
            
            setTimeout(() => {
                const answer = getAnswer(message);
                addMessage('bot', answer);
            }, 300);
        }

        function addMessage(role, content) {
            const placeholder = chatArea.querySelector('.chat-placeholder');
            if (placeholder) placeholder.remove();
            
            const div = document.createElement('div');
            div.className = 'chat-message ' + role;
            div.innerHTML = '<div class="bubble">' + content + '</div>';
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function getAnswer(question) {
            const query = question.toLowerCase().replace(/[？?，。！!、]/g, ' ').trim();
            const results = fuzzySearch(query);
            
            if (results.length > 0) {
                const best = results[0];
                recordView(best.id);
                
                let html = '<strong>' + best.title + '</strong>';
                html += '<p><span class="label">📌 问题：</span>' + best.problem + '</p>';
                
                if (best.causes && best.causes.length > 0) {
                    html += '<p><span class="label">🔍 可能原因：</span>' + best.causes.join('、') + '</p>';
                }
                
                html += '<p><span class="label">✅ 解决方案：</span></p><div style="margin-top:6px;">' + formatSolution(best.solution) + '</div>';
                
                if (best.steps && best.steps.length > 0) {
                    html += '<p><span class="label">📋 操作步骤：</span></p><ol>';
                    best.steps.forEach(s => html += '<li>' + s + '</li>');
                    html += '</ol>';
                }
                
                if (best.warning) {
                    html += '<div class="warning">' + best.warning + '</div>';
                }
                
                if (results.length > 1) {
                    html += '<div class="suggestion-links"><span class="label">💡 您可能还想问：</span><br>';
                    results.slice(1, 4).forEach(r => {
                        html += '<a href="#" onclick="jumpTo(' + r.id + ');return false;">• ' + r.title + '</a><br>';
                    });
                    html += '</div>';
                }
                
                return html;
            } else {
                let html = '抱歉，暂时没有找到与 "<strong>' + question + '</strong>" 相关的问题。<br><br>';
                html += '<span class="label">💡 建议：</span><br>';
                html += '• 试试更简短的关键词<br>';
                html += '• 使用上方的热门问题按钮';
                return html;
            }
        }

        function jumpTo(id) {
            const item = knowledgeBase.find(k => k.id === id);
            if (item) {
                searchInput.value = item.title;
                performSearch();
            }
        }

        function recordView(id) {
            viewStats[id] = (viewStats[id] || 0) + 1;
            localStorage.setItem('knowledgeViewStats', JSON.stringify(viewStats));
        }

        // ============ 事件绑定 ============
        // 发送消息
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // 搜索
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('input', () => showSuggestions(searchInput.value));
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                suggestions.classList.remove('show');
                performSearch();
            }
        });

        // 快捷按钮
        quickBtns.addEventListener('click', (e) => {
            const btn = e.target.closest('.quick-btn');
            if (btn && btn.dataset.id) {
                quickSearch(parseInt(btn.dataset.id));
            }
        });

        // 建议点击
        suggestions.addEventListener('click', (e) => {
            const item = e.target.closest('.suggestion-item');
            if (item && item.dataset.id) {
                quickSearch(parseInt(item.dataset.id));
                suggestions.classList.remove('show');
            }
        });

        // 点击其他地方关闭建议
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                suggestions.classList.remove('show');
            }
        });

        // ============ 启动 ============
        init();
    </script>
</body>
</html>
